<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mathe-Tutor – Chat UI</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <!-- Markdown + Sanitizer -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>

  <style>
    :root{
      --bg:#0b1020;
      --panel:#0f172a;   /* solid */
      --panel2:#111c3a;  /* solid */
      --text:#e5e7eb;
      --muted:#94a3b8;
      --border:rgba(148,163,184,.18);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius:16px;

      --bot:#111c3a;
      --user:#2563eb;
      --user2:#1d4ed8;

      --ok:#22c55e;
      --bad:#ef4444;
      --warn:#f59e0b;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      background:
        radial-gradient(1200px 800px at 20% -10%, rgba(37,99,235,.25), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, rgba(34,197,94,.12), transparent 55%),
        var(--bg);
      color:var(--text);
    }

    .app{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 18px;
      display:flex;
      flex-direction:column;
      min-height: 100vh;
      gap: 12px;
    }

    /* ---------- TOP (OPAQUE) ---------- */
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 14px;
      border:1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);          /* CHANGED: opaque */
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 50;
    }
    .title{display:flex; flex-direction:column; gap:2px;}
    .title h1{font-size:16px; margin:0; letter-spacing:.2px;}
    .title p{display:none;} /* subtitle hidden */

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      background: rgba(17,28,58,.85);    /* a bit more solid */
    }
    .mono{font-family:var(--mono)}
    .btn{
      border:0;
      border-radius: 12px;
      padding:10px 12px;
      font-weight:700;
      cursor:pointer;
      color:white;
      background: rgba(148,163,184,.12);
      border: 1px solid var(--border);
    }
    .btn:hover{filter:brightness(1.07)}
    .btn:disabled{opacity:.55; cursor:not-allowed;}

    .iconBtn{
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--user), var(--user2));
      box-shadow: 0 10px 18px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }
    .iconBtn:hover{ filter: brightness(1.07); }
    .iconBtn.secondary{
      background: rgba(148,163,184,.12);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .iconBtn.secondary:hover{ background: rgba(148,163,184,.18); }
    .iconBtn:disabled{ opacity: .55; cursor: not-allowed; }
    #btnMic.listening{
      outline: 2px solid rgba(34,197,94,.65);
      outline-offset: 2px;
    }

    /* ---------- SETTINGS (OPAQUE) ---------- */
    .settings{
      border:1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);          /* CHANGED: opaque */
      box-shadow: var(--shadow);
      overflow:hidden;
      position: sticky;
      top: 86px;
      z-index: 40;
    }
    .settingsHead{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px;
      cursor:pointer;
      user-select:none;
      border-bottom: 1px solid rgba(148,163,184,.12);
    }
    .settingsHead .left{display:flex; flex-direction:column; gap:2px;}
    .settingsHead .left .hint{font-size:12px; color:var(--muted);}
    .settingsBody{
      padding: 0 14px 14px;
      display:none;
      gap: 12px;
    }
    .settings.open .settingsBody{display:grid}
    .grid{display:grid; grid-template-columns: 1fr; gap: 12px;}
    @media(min-width:860px){
      .grid.cols2{grid-template-columns: 1.5fr .5fr}
      .grid.cols3{grid-template-columns: 1fr 1fr 1fr}
    }
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px}
    input[type="text"], select{
      width:100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline:none;
      background: rgba(17,28,58,.85);   /* more solid */
      color: var(--text);
    }
    input[type="text"]::placeholder{color: rgba(148,163,184,.6)}

    /* ---------- CHAT (internal scroll) ---------- */
    .chat{
      flex: 1 1 auto;
      min-height: 0;
      border:1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(15,23,42,.65);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .chatHeader{ display:none; }
    .bubble .small{ display:none; }

    .messages{
      padding: 14px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .msgRow{display:flex}
    .msgRow.user{justify-content:flex-end}
    .bubble{
      max-width: 90ch;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      line-height: 1.45;
      box-shadow: 0 10px 18px rgba(0,0,0,.18);
    }
    .bubble.bot{
      background: rgba(17,28,58,.78);
      color: var(--text);
      border-top-left-radius: 10px;
    }
    .bubble.user{
      background: linear-gradient(135deg, rgba(37,99,235,.92), rgba(29,78,216,.92));
      color: white;
      border: 1px solid rgba(255,255,255,.14);
      border-top-right-radius: 10px;
    }

    .bubble .md{white-space:normal}
    .bubble .md p{margin:0 0 10px}
    .bubble .md p:last-child{margin-bottom:0}
    .bubble .md ul, .bubble .md ol{margin: 8px 0 8px 22px; padding:0}
    .bubble .md li{margin: 4px 0}

    .katex{font-size: 1.02em}
    .katex-display{overflow:auto; padding: 6px 0}

    /* ---------- STATUS + FEEDBACK ---------- */
    .statusLine{
      font-size:12px;
      color: var(--muted);
      padding: 0 14px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      background: rgba(15,23,42,.70);
      border-top: 1px solid rgba(148,163,184,.12);
    }
    .statusLeft{
      display:flex;
      align-items:center;
      gap: 8px;
      min-width: 0;
    }
    .statusDot{
      display:inline-block;
      width:8px;height:8px;border-radius:99px;
      background: rgba(148,163,184,.6);
      vertical-align:middle;
      flex: 0 0 auto;
    }
    .statusDot.ok{background: var(--ok)}
    .statusDot.bad{background: var(--bad)}
    .statusDot.warn{background: var(--warn)}
    #statusLine{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

    .feedbackLink{
      font-size:12px;
      color: rgba(148,163,184,.95);
      text-decoration: underline;
      cursor: pointer;
      user-select:none;
      flex: 0 0 auto;
    }
    .feedbackLink:hover{filter:brightness(1.08)}

    .composer{
      border-top:1px solid var(--border);
      background: rgba(17,28,58,.75);
      padding: 10px;
      display:flex;
      gap: 10px;
      align-items:flex-end;
    }
    textarea{
      width:100%;
      min-height: 44px;
      max-height: none;
      overflow: hidden;
      resize: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline:none;
      background: rgba(15,23,42,.85);
      color: var(--text);
      line-height: 1.4;
    }
    textarea::-webkit-resizer{display:none;}
  </style>
</head>

<body>
  <div class="app">

    <div class="top">
      <div class="title">
        <h1>Mathe-Tutor</h1>
        <p>Assessment → Lernmodus (automatisch) · Aufgaben aus Aufgaben-Katalog · Hilfen nur aus Skript-Context</p>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <span class="pill"><span>Route:</span> <span class="mono">POST /chat</span></span>
        <button class="btn" id="btnNew" onclick="loadQuestion(true)" title="Manuell neue Aufgabe holen (nur im Lernmodus)">
          Neue Aufgabe
        </button>
      </div>
    </div>

    <div class="settings" id="settings">
      <div class="settingsHead" onclick="toggleSettings()">
        <div class="left">
          <div style="font-weight:700;">Einstellungen</div>
          <div class="hint">API-URL, Thema, Basis-ID (Katalog-ID)</div>
        </div>
        <div class="pill"><span class="mono" id="settingsState">geschlossen</span></div>
      </div>

      <div class="settingsBody">
        <div class="grid cols2">
          <div>
            <label for="apiUrl">API-URL (API Gateway Endpoint)</label>
            <input id="apiUrl" type="text" value="https://90gv8ggvod.execute-api.eu-north-1.amazonaws.com/chat" />
          </div>
          <div>
            <label for="topic">Thema</label>
            <select id="topic">
              <option value="komplexe_zahlen" selected>Komplexe Zahlen</option>
            </select>
          </div>
        </div>

        <div class="grid cols3">
          <div>
            <label for="baseId">Basis-Aufgabe-ID (optional)</label>
            <input id="baseId" type="text" placeholder="z. B. K7_22" />
          </div>
          <div>
            <label for="studentId">Student-ID (Browser)</label>
            <input id="studentId" type="text" readonly />
          </div>
          <div style="display:flex; gap:10px; align-items:flex-end;">
            <button class="btn" style="width:100%;" onclick="loadQuestion(true)">Aufgabe holen</button>
          </div>
        </div>

        <div class="statusLine" id="settingsHint" style="border-top:none; background:transparent; padding: 6px 0 0;">
          Tipp: Wenn du nur die Basis-URL einträgst, wird automatisch <span class="mono">/chat</span> angehängt.
        </div>
      </div>
    </div>

    <div class="chat">
      <div class="messages" id="messages"></div>

      <div class="statusLine">
        <div class="statusLeft">
          <span class="statusDot" id="dot"></span>
          <span id="statusLine">Bereit.</span>
        </div>
        <span class="feedbackLink" onclick="openFeedback()">Feedback geben</span>
      </div>

      <div class="composer">
        <button class="iconBtn secondary" id="btnMic" type="button"
                title="Spracherkennung starten/stoppen"
                onclick="toggleDictation()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 0-2 0 3 3 0 1 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A5 5 0 0 0 17 11Z"/>
          </svg>
        </button>

        <textarea id="answer" rows="1"
                  placeholder="Schreibe deine Antwort… (Enter = senden, Shift+Enter = neue Zeile)"></textarea>

        <button class="iconBtn" id="btnSend" type="button" title="Senden" onclick="submitAnswer()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3.4 20.2 21 12 3.4 3.8 3 10l10 2-10 2 .4 6.2Z"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

<script>
  // --------- State ----------
  let lastQuestion = "";
  let lastTopic = "";
  let lastQuestionId = "";
  let lastPhase = "";
  let lastBaseQuestionId = "";

  // ---- student_id (persistiert im Browser) ----
  function getStudentId(){
    const key = "tutor_student_id";
    let id = localStorage.getItem(key);
    if(!id){
      id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ("sid_" + Math.random().toString(16).slice(2) + Date.now());
      localStorage.setItem(key, id);
    }
    return id;
  }
  const studentId = getStudentId();

  document.addEventListener("DOMContentLoaded", () => {
    const sid = document.getElementById("studentId");
    if(sid) sid.value = studentId;
  });

  // --------- Utils ----------
  function normalizeApiUrl(url){
    url = (url || "").trim();
    if(!url) return "";
    if(!url.endsWith("/chat") && !url.includes("/chat?") && !url.match(/\/chat\b/)){
      url = url.replace(/\/+$/, "") + "/chat";
    }
    return url;
  }

  function setStatus(text, state=null){
    const dot = document.getElementById("dot");
    const line = document.getElementById("statusLine");
    line.textContent = text || "";
    dot.className = "statusDot";
    if(state === "ok") dot.classList.add("ok");
    else if(state === "bad") dot.classList.add("bad");
    else if(state === "warn") dot.classList.add("warn");
  }

  function toggleSettings(){
    const el = document.getElementById("settings");
    el.classList.toggle("open");
    document.getElementById("settingsState").textContent = el.classList.contains("open") ? "offen" : "geschlossen";
  }

  function setBusy(busy){
    document.getElementById("btnSend").disabled = busy;
    const newBtn = document.getElementById("btnNew");
    if(newBtn) newBtn.disabled = busy || (lastPhase === "assessment");
    const mic = document.getElementById("btnMic");
    if(mic) mic.disabled = busy;
  }

  function openFeedback(){
    const subject = encodeURIComponent("Feedback Mathe-Tutor");
    const body = encodeURIComponent(
      "Beschreibe bitte kurz dein Feedback:\n\n" +
      "- Was ist passiert?\n" +
      "- Welche Aufgabe/ID (falls bekannt)?\n" +
      "- Browser/Device?\n\n" +
      "Danke!"
    );
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }

  // --------- Markdown + KaTeX ----------
  function normalizeMathDelimiters(s){
    if(!s) return "";
    s = s.replace(/\$\$\s*\$\$/g, "");
    s = s.replace(/\\\(\s*\$\$\s*/g, "\\(");
    s = s.replace(/\s*\$\$\s*\\\)/g, "\\)");
    s = s.replace(/\\\[\s*\$\$\s*/g, "\\[");
    s = s.replace(/\s*\$\$\s*\\\]/g, "\\]");
    s = s.replace(/\$\$\s*\n\s*\$\$/g, "$$");
    return s;
  }

  function wrapLatexEnvironments(text){
    let t = text || "";
    t = t.replace(/\\begin\{([a-zA-Z*]+)\}([\s\S]*?)\\end\{\1\}/g, (m, env, body, offset, full) => {
      const before = full.slice(Math.max(0, offset - 6), offset);
      const after  = full.slice(offset + m.length, offset + m.length + 6);
      const alreadyMath =
        /\$\$\s*$/.test(before) || /^\s*\$\$/.test(after) ||
        /\\\[\s*$/.test(before) || /^\s*\\\]/.test(after) ||
        /\\\(\s*$/.test(before) || /^\s*\\\)/.test(after);
      if(alreadyMath) return m;
      return `\n\\[\n${m}\n\\]\n`;
    });
    return t;
  }

  function renderMarkdownWithKaTeX(text){
    let formattedText = String(text || "");
    formattedText = normalizeMathDelimiters(formattedText);
    formattedText = wrapLatexEnvironments(formattedText);

    const mathPlaceholder = [];
    let idx = 0;

    // $$...$$
    formattedText = formattedText.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
      mathPlaceholder.push(match);
      return `@@MATH_BLOCK_${idx++}@@`;
    });

    // \[...\]
    formattedText = formattedText.replace(/\\\[([\s\S]*?)\\\]/g, (match) => {
      mathPlaceholder.push(match);
      return `@@MATH_BLOCK_${idx++}@@`;
    });

    // \( ... \)
    formattedText = formattedText.replace(/\\\(([\s\S]*?)\\\)/g, (match) => {
      mathPlaceholder.push(match);
      return `@@MATH_INLINE_${idx++}@@`;
    });

    // $ ... $  (PATCH: allow newlines, but still avoid $$)
    formattedText = formattedText.replace(/(^|[^$])\$(?!\$)([\s\S]+?)\$(?!\$)/g, (m, pre, inner) => {
      const token = `@@MATH_INLINE_${idx}@@`;
      mathPlaceholder.push(`$${inner}$`);
      idx++;
      return `${pre}${token}`;
    });

    if(typeof marked !== "undefined"){
      try{
        marked.setOptions({ breaks: true, gfm: true });
        formattedText = marked.parse(formattedText);
      }catch(e){
        console.error("Marked Fehler:", e);
      }
    }

    if(typeof DOMPurify !== "undefined"){
      formattedText = DOMPurify.sanitize(formattedText, { USE_PROFILES: { html: true } });
    }

    formattedText = formattedText.replace(/@@MATH_BLOCK_(\d+)@@/g, (match, id) => {
      const original = mathPlaceholder[Number(id)] || "";
      const inner = original
        .replace(/^\$\$/,"").replace(/\$\$$/,"")
        .replace(/^\\\[/,"").replace(/\\\]$/,"");
      try{
        return katex.renderToString(inner, { displayMode: true, throwOnError: false });
      }catch{
        return original;
      }
    });

    formattedText = formattedText.replace(/@@MATH_INLINE_(\d+)@@/g, (match, id) => {
      const original = mathPlaceholder[Number(id)] || "";
      const inner = original
        .replace(/^\\\(/,"").replace(/\\\)$/,"")
        .replace(/^\$/,"").replace(/\$$/,"");
      try{
        return katex.renderToString(inner, { displayMode: false, throwOnError: false });
      }catch{
        return original;
      }
    });

    return formattedText;
  }

  function addMessage(role, text){
    const wrap = document.createElement("div");
    wrap.className = "msgRow " + (role === "user" ? "user" : "bot");

    const b = document.createElement("div");
    b.className = "bubble " + (role === "user" ? "user" : "bot");

    const content = document.createElement("div");
    content.className = "md";

    if(role === "bot"){
      content.innerHTML = renderMarkdownWithKaTeX(text || "");
    }else{
      content.textContent = text || "";
    }

    b.appendChild(content);
    wrap.appendChild(b);
    document.getElementById("messages").appendChild(wrap);

    const sc = document.getElementById("messages");
    sc.scrollTop = sc.scrollHeight;
  }

  function libsReady(){
    return !!(window.marked && window.DOMPurify && window.katex);
  }

  async function waitForLibs(){
    const t0 = Date.now();
    while(!libsReady()){
      if(Date.now() - t0 > 5000) break;
      await new Promise(r => setTimeout(r, 30));
    }
  }

  // --------- Dictation ----------
  let recognition = null;
  let dictating = false;

  function toggleDictation(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      setStatus("Spracherkennung wird von diesem Browser nicht unterstützt.", "warn");
      return;
    }

    if(!recognition){
      recognition = new SpeechRecognition();
      recognition.lang = "de-DE";
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onresult = (event) => {
        let interim = "";
        let finalText = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const txt = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += txt + " ";
          else interim += txt;
        }

        if(finalText.trim()){
          answerEl.value = (answerEl.value ? (answerEl.value.trimEnd() + " ") : "") + finalText.trim();
          autoGrow(answerEl);
        }
        if(interim.trim()){
          setStatus("Spracheingabe: " + interim.trim(), null);
        }
      };

      recognition.onerror = () => {
        setStatus("Spracherkennung-Fehler. Prüfe Mikrofonrechte.", "bad");
        dictating = false;
        updateMicUI();
      };

      recognition.onend = () => {
        if(dictating){
          try { recognition.start(); } catch(_) {}
        }
      };
    }

    dictating = !dictating;
    updateMicUI();

    if(dictating){
      setStatus("Spracherkennung läuft…", null);
      try { recognition.start(); } catch(_) {}
    } else {
      setStatus("Spracherkennung gestoppt.", "ok");
      try { recognition.stop(); } catch(_) {}
    }
  }

  function updateMicUI(){
    const micBtn = document.getElementById("btnMic");
    if(micBtn) micBtn.classList.toggle("listening", dictating);
  }

  // --------- API ----------
  function applyServerStateFromQuestionResponse(data){
    lastQuestion = data.rendered_question || "";
    lastTopic = data.topic || lastTopic || "";
    lastQuestionId = data.question_id || lastQuestionId || "";
    lastPhase = data.phase || lastPhase || "";
    lastBaseQuestionId = data.base_question_id || "";
  }

  async function loadQuestion(manual=false){
    const api = normalizeApiUrl(document.getElementById("apiUrl").value);
    const topic = "komplexe_zahlen";
    const baseId = (document.getElementById("baseId").value || "").trim() || undefined;

    if(!api){
      setStatus("Bitte eine API-URL eintragen.", "bad");
      return;
    }

    setBusy(true);
    setStatus(manual ? "Lade…" : "Starte…", null);

    const payload = { mode: "next_question", student_id: studentId, topic };
    if(baseId) payload.base_question_id = baseId;

    try{
      const res = await fetch(api, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

      if(!res.ok){
        setStatus((data && data.error) ? data.error : ("HTTP " + res.status), "bad");
        addMessage("bot", `**Fehler:** ${(data && data.error) ? data.error : ("HTTP " + res.status)}`);
        return;
      }

      applyServerStateFromQuestionResponse(data);

      if(data.message) addMessage("bot", data.message);
      if(lastQuestion) addMessage("bot", lastQuestion);

      setStatus("Bereit.", "ok");
    }catch(e){
      setStatus(e && e.message ? e.message : String(e), "bad");
      addMessage("bot", `**Netzwerkfehler:** ${e && e.message ? e.message : String(e)}`);
    }finally{
      setBusy(false);
    }
  }

  async function submitAnswer(){
    const api = normalizeApiUrl(document.getElementById("apiUrl").value);
    const answer = (document.getElementById("answer").value || "").trim();

    if(!api){
      setStatus("Bitte eine API-URL eintragen.", "bad");
      return;
    }
    if(!lastQuestion){
      setStatus("Noch keine Frage geladen.", "warn");
      return;
    }
    if(!answer){
      setStatus("Bitte eine Antwort eingeben.", "warn");
      return;
    }

    setBusy(true);
    setStatus("Sende…", null);

    addMessage("user", answer);
    answerEl.value = "";
    autoGrow(answerEl);

    const payload = {
      mode: "submit_answer",
      student_id: studentId,
      last_question: lastQuestion,
      student_answer: answer,
      topic: "komplexe_zahlen",
      question_id: lastQuestionId,
      base_question_id: lastBaseQuestionId || undefined
    };

    try{
      const res = await fetch(api, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

      if(!res.ok){
        setStatus((data && data.error) ? data.error : ("HTTP " + res.status), "bad");
        addMessage("bot", `**Fehler:** ${(data && data.error) ? data.error : ("HTTP " + res.status)}`);
        return;
      }

      if(data.message) addMessage("bot", data.message);

      if(data.rendered_question){
        applyServerStateFromQuestionResponse(data);
        addMessage("bot", data.rendered_question);
        setStatus("Bereit.", "ok");
        return;
      }

      if(data.tutor_feedback || data.next_question || data.hints){
        let botText = (data.tutor_feedback || "").trim() || "Okay — weiter.";
        if(Array.isArray(data.hints) && data.hints.length){
          botText += "\n\n**Hinweise:**\n" + data.hints.map(h => `- ${h}`).join("\n");
        }
        if((data.next_question || "").trim()){
          botText += "\n\n**Nächste Frage:**\n" + (data.next_question || "").trim();
        }
        addMessage("bot", botText);
        setStatus("Bereit.", "ok");
        return;
      }

      addMessage("bot", "Antwort erhalten.");
      setStatus("Bereit.", "ok");

    } catch(e){
      setStatus(e.message || String(e), "bad");
      addMessage("bot", `**Netzwerkfehler:** ${e.message || String(e)}`);
    } finally {
      setBusy(false);
    }
  }

  const answerEl = document.getElementById("answer");
  function autoGrow(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  answerEl.addEventListener("input", () => requestAnimationFrame(() => autoGrow(answerEl)));

  answerEl.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      submitAnswer();
    }
  });

  (async function init(){
    await waitForLibs();
    addMessage("bot", "Los geht’s — wir starten direkt mit Komplexen Zahlen.");
    setStatus(libsReady() ? "Bereit. (Markdown + KaTeX aktiv)" : "Bereit. (Renderer lädt…)", libsReady() ? "ok" : "warn");
    await loadQuestion(false);
  })();
</script>
</body>
</html>
